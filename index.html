<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FC Lite 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Arial, sans-serif; }
    body { overflow: hidden; background: #0f172a; }
    #scoreboard {
      position: absolute; top: 22px; left: 28px; display: flex; align-items: stretch;
      background: #0f172a; color: white; border-radius: 4px; overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45); font-weight: 800; font-size: 15px;
    }
    .team-box { padding: 7px 16px; display: flex; align-items: center; background: #f8fafc; color: #0f172a; }
    .home-color { border-left: 5px solid #dc2626; }
    .away-color { border-right: 5px solid #2563eb; }
    .center-info { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 14px; background: #1e293b; }
    #score { font-size: 17px; letter-spacing: 1px; color: #fff; }
    #timer { font-size: 11px; color: #cbd5e1; font-weight: 600; }
    #player-hud {
      position: absolute; bottom: 24px; left: 28px; display: flex; flex-direction: column; gap: 6px;
      background: rgba(15, 23, 42, 0.85); padding: 10px 14px; border-radius: 6px;
      border-left: 4px solid #22c55e; color: white; width: 210px;
    }
    #player-name { font-size: 13px; font-weight: 800; }
    #stamina-bg { width: 100%; height: 7px; background: #334155; border-radius: 3px; overflow: hidden; }
    #stamina-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #16a34a, #4ade80); }
    #radar {
      position: absolute; bottom: 24px; right: 28px; width: 190px; height: 118px;
      background: rgba(15, 23, 42, 0.65); border: 2px solid rgba(255,255,255,0.45); border-radius: 4px;
    }
    #controls {
      position: absolute; top: 22px; right: 28px; color: #f8fafc;
      background: rgba(15, 23, 42, 0.75); padding: 8px 14px; border-radius: 4px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="scoreboard">
    <div class="team-box home-color">HOME</div>
    <div class="center-info"><div id="score">0 - 0</div><div id="timer">00:00</div></div>
    <div class="team-box away-color">AWAY</div>
  </div>
  <div id="controls">
    <b>WASD / Arrows:</b> Run &nbsp;|&nbsp; <b>Space:</b> Shoot / Pass &nbsp;|&nbsp; <b>Shift:</b> Sprint &nbsp;|&nbsp; <b>Q:</b> Switch Player
  </div>
  <div id="player-hud">
    <div id="player-name">#10 STRIKER</div>
    <div id="stamina-bg"><div id="stamina-fill"></div></div>
  </div>
  <canvas id="radar" width="190" height="118"></canvas>
  <script src="node_modules/three/build/three.min.js"></script>
  <script src="node_modules/three/examples/js/loaders/GLTFLoader.js"></script>
  <script src="node_modules/three/examples/js/utils/SkeletonUtils.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x93c5fd);
    scene.fog = new THREE.Fog(0x93c5fd, 80, 200);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 350);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x3f6212, 0.85));
    const sun = new THREE.DirectionalLight(0xfffbeb, 1.1);
    sun.position.set(35, 55, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024; sun.shadow.mapSize.height = 1024;
    const d = 50;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    scene.add(sun);

    function createPitchTexture() {
      const c = document.createElement('canvas');
      c.width = 2048; c.height = 1024;
      const ctx = c.getContext('2d');
      const stripes = 18, sw = c.width / stripes;
      for (let i = 0; i < stripes; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#4d9a34' : '#58ab3c';
        ctx.fillRect(i * sw, 0, sw, c.height);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.92)';
      ctx.lineWidth = 7;
      ctx.strokeRect(50, 40, c.width - 100, c.height - 80);
      ctx.beginPath(); ctx.moveTo(c.width / 2, 40); ctx.lineTo(c.width / 2, c.height - 40); ctx.stroke();
      ctx.beginPath(); ctx.arc(c.width / 2, c.height / 2, 125, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeRect(50, 230, 260, c.height - 460);
      ctx.strokeRect(c.width - 310, 230, 260, c.height - 460);
      return new THREE.CanvasTexture(c);
    }

    const pitch = new THREE.Mesh(
      new THREE.PlaneGeometry(86, 54),
      new THREE.MeshLambertMaterial({ map: createPitchTexture() })
    );
    pitch.rotation.x = -Math.PI / 2; pitch.receiveShadow = true;
    scene.add(pitch);

    function createCrowdTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#334155'; ctx.fillRect(0, 0, 512, 128);
      const colors = ['#ef4444', '#3b82f6', '#facc15', '#f8fafc', '#22c55e', '#f97316'];
      for (let y = 8; y < 120; y += 12) {
        for (let x = 6; x < 506; x += 10) {
          ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
          ctx.fillRect(x, y, 6, 7);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(6, 1);
      return tex;
    }
    const crowdMat = new THREE.MeshLambertMaterial({ map: createCrowdTexture() });
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xe2e8f0 });

    function buildStand(w, d, x, z, rotY) {
      const g = new THREE.Group();
      const tier = new THREE.Mesh(new THREE.BoxGeometry(w, 9, d), crowdMat); tier.position.y = 4.5;
      const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 2, 1.2, d + 4), wallMat); roof.position.set(0, 10.5, 1.5);
      const back = new THREE.Mesh(new THREE.BoxGeometry(w + 2, 11, 1.5), wallMat); back.position.set(0, 5.5, -d / 2);
      g.add(tier, roof, back);
      g.position.set(x, 0, z); g.rotation.y = rotY;
      scene.add(g);
    }
    buildStand(92, 12, 0, -35, 0);
    buildStand(68, 12, -51, 0, Math.PI / 2);
    buildStand(68, 12, 51, 0, -Math.PI / 2);

    function createGoal(xPos, dir) {
      const g = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 2.8), postMat); p1.position.set(0, 1.4, -4.4);
      const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 2.8), postMat); p2.position.set(0, 1.4, 4.4);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 8.9), postMat);
      bar.rotation.x = Math.PI / 2; bar.position.set(0, 2.8, 0);
      const net = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 2.75, 8.7),
        new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.35 })
      );
      net.position.set(dir * 1.1, 1.38, 0);
      g.add(p1, p2, bar, net);
      g.position.set(xPos, 0, 0);
      scene.add(g);
    }
    createGoal(-39.5, -1); createGoal(39.5, 1);

    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.42, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
    );
    ball.castShadow = true; ball.position.set(0, 0.42, 0);
    scene.add(ball);
    let ballVel = new THREE.Vector3(0, 0, 0);

    const marker = new THREE.Mesh(
      new THREE.ConeGeometry(0.35, 0.65, 3),
      new THREE.MeshBasicMaterial({ color: 0x22c55e })
    );
    marker.rotation.x = Math.PI;
    scene.add(marker);
    const players = [];
    const clock = new THREE.Clock();

    // Load the Rigged 3D Human Model (assets/player.glb)
    const loader = new THREE.GLTFLoader();
    loader.load('assets/player.glb', (gltf) => {
      const baseModel = gltf.scene;
      const animations = gltf.animations;

      function spawn3DPlayer(x, z, team, num, role) {
        const clone = THREE.SkeletonUtils.clone(baseModel);
        clone.scale.set(1.35, 1.35, 1.35);

        // Apply Team Kit Colors & Shadows
        clone.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.material = child.material.clone();
            child.material.color.setHex(team === 'home' ? 0xff4d4d : 0x4d94ff);
          }
        });

        const wrapper = new THREE.Group();
        clone.rotation.y = Math.PI; // Align forward facing
        wrapper.add(clone);
        wrapper.position.set(x, 0, z);
        scene.add(wrapper);

        const mixer = new THREE.AnimationMixer(clone);
        const idleAction = mixer.clipAction(animations[0]);
        const runAction = mixer.clipAction(animations[1]);
        idleAction.play();

        players.push({
          mesh: wrapper,
          mixer,
          idleAction,
          runAction,
          isRunning: false,
          homePos: new THREE.Vector3(x, 0, z),
          team,
          label: `#${num} ${role}`
        });
      }

      // Spawn 7v7 Rigged 3D Lineup
      spawn3DPlayer(-4, 0, 'home', '10', 'STRIKER');
      spawn3DPlayer(-10, -13, 'home', '7', 'LEFT WING');
      spawn3DPlayer(-10, 13, 'home', '11', 'RIGHT WING');
      spawn3DPlayer(-17, 0, 'home', '8', 'MIDFIELDER');
      spawn3DPlayer(-26, -9, 'home', '4', 'DEFENDER');
      spawn3DPlayer(-26, 9, 'home', '5', 'DEFENDER');
      spawn3DPlayer(-37, 0, 'home', '1', 'GOALKEEPER');

      spawn3DPlayer(4, 0, 'away', '9', 'CPU');
      spawn3DPlayer(11, -13, 'away', '7', 'CPU');
      spawn3DPlayer(11, 13, 'away', '11', 'CPU');
      spawn3DPlayer(18, 0, 'away', '6', 'CPU');
      spawn3DPlayer(27, -9, 'away', '2', 'CPU');
      spawn3DPlayer(27, 9, 'away', '3', 'CPU');
      spawn3DPlayer(37, 0, 'away', '1', 'GK');
    });

    function setPlayerAnim(p, running) {
      if (p.isRunning === running) return;
      p.isRunning = running;
      if (running) {
        p.idleAction.fadeOut(0.15);
        p.runAction.reset().fadeIn(0.15).play();
      } else {
        p.runAction.fadeOut(0.15);
        p.idleAction.reset().fadeIn(0.15).play();
      }
    }

    let activeIdx = 0, homeScore = 0, awayScore = 0, stamina = 100, matchSeconds = 0;
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyQ' && players.length > 0) {
        activeIdx = (activeIdx + 1) % 6;
        document.getElementById('player-name').innerText = players[activeIdx].label;
      }
      if (e.code === 'Space' && players.length > 0 && players[activeIdx].mesh.position.distanceTo(ball.position) < 2.3) {
        const dir = new THREE.Vector3().subVectors(ball.position, players[activeIdx].mesh.position).normalize();
        dir.y = 0.22;
        ballVel.copy(dir.multiplyScalar(0.9));
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function resetPositions() {
      ball.position.set(0, 0.42, 0); ballVel.set(0, 0, 0);
      players.forEach(p => p.mesh.position.copy(p.homePos));
    }

    const rCtx = document.getElementById('radar').getContext('2d');
    function drawRadar() {
      rCtx.clearRect(0, 0, 190, 118);
      rCtx.strokeStyle = 'rgba(255,255,255,0.35)';
      rCtx.strokeRect(4, 4, 182, 110);
      rCtx.beginPath(); rCtx.moveTo(95, 4); rCtx.lineTo(95, 114); rCtx.stroke();
      rCtx.beginPath(); rCtx.arc(95, 59, 16, 0, Math.PI * 2); rCtx.stroke();

      players.forEach((p, idx) => {
        const rx = ((p.mesh.position.x + 40) / 80) * 182 + 4;
        const rz = ((p.mesh.position.z + 25) / 50) * 110 + 4;
        rCtx.fillStyle = idx === activeIdx ? '#22c55e' : (p.team === 'home' ? '#ef4444' : '#3b82f6');
        rCtx.beginPath(); rCtx.arc(rx, rz, 3.5, 0, Math.PI * 2); rCtx.fill();
      });
      const bx = ((ball.position.x + 40) / 80) * 182 + 4;
      const bz = ((ball.position.z + 25) / 50) * 110 + 4;
      rCtx.fillStyle = '#ffffff'; rCtx.beginPath(); rCtx.arc(bx, bz, 2.5, 0, Math.PI * 2); rCtx.fill();
    }

    setInterval(() => {
      matchSeconds++;
      const m = String(Math.floor(matchSeconds / 60)).padStart(2, '0');
      const s = String(matchSeconds % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${m}:${s}`;
    }, 1000);

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      players.forEach(p => p.mixer.update(delta));

      if (players.length > 0) {
        const activeObj = players[activeIdx];
        const activePlayer = activeObj.mesh;
        const sprinting = keys['ShiftLeft'] && stamina > 5;
        const speed = sprinting ? 0.27 : 0.17;

        let moveX = 0, moveZ = 0;
        if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

        if (moveX !== 0 || moveZ !== 0) {
          const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize().multiplyScalar(speed);
          activePlayer.position.add(moveVec);
          activePlayer.rotation.y = Math.atan2(moveX, moveZ);
          setPlayerAnim(activeObj, true);
          if (sprinting) stamina = Math.max(0, stamina - 0.35);
        } else {
          setPlayerAnim(activeObj, false);
          stamina = Math.min(100, stamina + 0.25);
        }
        document.getElementById('stamina-fill').style.width = stamina + '%';

        marker.position.set(activePlayer.position.x, 3.1, activePlayer.position.z);
        marker.rotation.y += 0.05;

        players.forEach((p, idx) => {
          if (idx === activeIdx) return;
          const isGK = p.label.includes('GK') || p.label.includes('GOALKEEPER');
          let target = p.homePos.clone();
          if (isGK) {
            target.z = THREE.MathUtils.clamp(ball.position.z, -4.2, 4.2);
          } else if (p.mesh.position.distanceTo(ball.position) < 18) {
            target = ball.position;
          }
          const dir = new THREE.Vector3().subVectors(target, p.mesh.position); dir.y = 0;
          if (dir.length() > 0.4) {
            p.mesh.position.add(dir.clone().normalize().multiplyScalar(p.team === 'away' ? 0.12 : 0.1));
            p.mesh.rotation.y = Math.atan2(dir.x, dir.z);
            setPlayerAnim(p, true);
          } else {
            setPlayerAnim(p, false);
          }

          if (p.mesh.position.distanceTo(ball.position) < 1.15) {
            const push = new THREE.Vector3().subVectors(ball.position, p.mesh.position).normalize();
            ballVel.x = push.x * (isGK ? 0.75 : 0.28);
            ballVel.z = push.z * (isGK ? 0.4 : 0.28);
            if (p.team === 'away' && !isGK && Math.random() < 0.03) ballVel.x = -0.7;
          }
        });

        if (activePlayer.position.distanceTo(ball.position) < 1.15) {
          const push = new THREE.Vector3().subVectors(ball.position, activePlayer.position).normalize();
          ballVel.x = push.x * (speed * 1.45); ballVel.z = push.z * (speed * 1.45);
        }
      }

      ball.position.add(ballVel); ballVel.multiplyScalar(0.96);
      if (ball.position.y > 0.42) ballVel.y -= 0.02;
      if (ball.position.y <= 0.42) { ball.position.y = 0.42; ballVel.y = 0; }

      if (Math.abs(ball.position.z) < 4.4) {
        if (ball.position.x > 39.5) { homeScore++; document.getElementById('score').innerText = `${homeScore} - ${awayScore}`; resetPositions(); }
        else if (ball.position.x < -39.5) { awayScore++; document.getElementById('score').innerText = `${homeScore} - ${awayScore}`; resetPositions(); }
      }

      if (Math.abs(ball.position.x) > 39.5) ballVel.x *= -0.8;
      if (Math.abs(ball.position.z) > 24.5) ballVel.z *= -0.8;

      camera.position.lerp(new THREE.Vector3(ball.position.x * 0.65, 19, ball.position.z * 0.5 + 31), 0.08);
      camera.lookAt(ball.position.x * 0.7, 0.5, ball.position.z * 0.4);
      drawRadar();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
  </script>
</body>
</html>
