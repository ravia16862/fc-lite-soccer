name: Build Soccer Game EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch 3D Human Character Model
        run: |
          git clone --depth 1 https://github.com temp-models
          New-Item -ItemType Directory -Force -Path assets
          Copy-Item "temp-models/Models/CesiumMan/glTF-Binary/CesiumMan.glb" -Destination "assets/player.glb"
          Remove-Item -Recurse -Force temp-models

      - name: Build Windows EXE
        run: npm run build

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FC-Lite-Soccer-Windows
          path: dist/win-unpacked/
